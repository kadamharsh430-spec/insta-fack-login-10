```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Demo Entries</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            background: #f5f5f5;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        .time {
            color: #777;
            font-size: 12px;
            margin-bottom: 12px;
        }

        .name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .game {
            color: #444;
        }

        .empty {
            background: white;
            padding: 25px;
            text-align: center;
            border-radius: 10px;
            color: #777;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #0095f6;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📋 Demo Entries</h1>

    {% if submissions %}

        {% for item in submissions %}

            <div class="card">

                <div class="time">
                    {{ item.time }}
                </div>

                <div class="name">
                    Username: {{ item.username }}
                </div>

                <div class="game">
                    Favorite Game: {{ item.game }}
                </div>

            </div>

        {% endfor %}

    {% else %}

        <div class="empty">
            No demo entries yet.
        </div>

    {% endif %}

    <a class="back" href="/">
        ← Back to Demo
    </a>

</div>

</body>
</html>
```
