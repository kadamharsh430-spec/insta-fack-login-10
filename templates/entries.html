
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Demo Entries</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 30px;
      background: #f2f4f7;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 12px;
      box-shadow: 0 5px 20px #0001;
    }

    .number {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .row {
      padding: 7px 0;
      border-bottom: 1px solid #eee;
    }

    .empty {
      text-align: center;
      padding: 40px;
      background: white;
      border-radius: 12px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Demo Entries</h1>

    <div id="entries"></div>

  </div>

  <script>
    const entriesBox = document.getElementById("entries");

    const entries =
      JSON.parse(localStorage.getItem("demoEntries")) || [];

    if (entries.length === 0) {

      entriesBox.innerHTML = `
        <div class="empty">
          No demo entries yet.
        </div>
      `;

    } else {

      entriesBox.innerHTML = entries.map((entry, index) => `
        <div class="card">

          <div class="number">
            Entry #${index + 1}
          </div>

          <div class="row">
            <b>Username:</b> ${escapeHTML(entry.username)}
          </div>

          <div class="row">
            <b>Demo password:</b> ${escapeHTML(entry.password)}
          </div>

          <div class="row">
            <b>Time:</b> ${escapeHTML(entry.time)}
          </div>

        </div>
      `).join("");
    }

    function escapeHTML(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>

</body>
</html>
