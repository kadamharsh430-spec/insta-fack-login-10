
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Login</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
    }

    .box {
      width: 350px;
      background: white;
      padding: 35px;
      border-radius: 15px;
      box-shadow: 0 15px 40px #0005;
      text-align: center;
    }

    h1 {
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fafafa;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      background: #0095f6;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #0077c8;
    }

    .msg {
      margin-top: 15px;
      color: #555;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Demo Login</h1>

    <form id="loginForm">
      <input
        type="text"
        id="username"
        placeholder="username"
        required
      >

      <input
        type="password"
        id="password"
        placeholder=" password"
        required
      >

      <button type="submit">Log In</button>
    </form>

    <div class="msg" id="message"></div>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      const entry = {
        username: username,
        password: password,
        time: new Date().toLocaleString()
      };

      let entries = JSON.parse(localStorage.getItem("Entries")) || [];

      entries.push(entry);

      localStorage.setItem("demoEntries", JSON.stringify(entries));

      document.getElementById("message").textContent =
        " login successful!";

      setTimeout(() => {
        window.location.href = "entities.html";
      }, 800);
    });
  </script>

</body>
</html>
