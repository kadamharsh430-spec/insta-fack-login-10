<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Style Demo</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #0b0f12;
    color: #f5f5f5;
    overflow: hidden;
}

/* LEFT SIDEBAR */
.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 72px;
    height: 100vh;
    border-right: 1px solid #25282c;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 25px;
    gap: 28px;
    background: #0b0f12;
}

.logo {
    font-size: 27px;
    margin-bottom: 18px;
}

.icon {
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #aeb4ba;
    font-size: 23px;
    cursor: pointer;
}

.icon:hover {
    color: white;
}

/* MAIN */
.main {
    margin-left: 72px;
    height: 100vh;
    overflow-y: auto;
}

/* PROFILE HEADER */
.profile {
    width: 760px;
    margin: 55px auto 0;
}

.profile-header {
    display: flex;
    align-items: center;
    gap: 35px;
}

.avatar {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    border: 4px solid #22272b;
    background: linear-gradient(135deg, #333, #111);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.username {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 25px;
}

.stats {
    display: flex;
    gap: 25px;
    color: #aeb4ba;
}

.stats b {
    color: white;
}

/* BUTTON */
.follow-btn {
    margin-top: 32px;
    width: 100%;
    height: 40px;
    background: #191d21;
    border: 1px solid #292d32;
    border-radius: 9px;
    color: white;
}

/* POST */
.post {
    width: 245px;
    height: 325px;
    margin-top: 45px;
    overflow: hidden;
}

.post img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* DARK OVERLAY */
.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.68);
    display: flex;
    align-items: center;
    justify-content: center;
}

/* LOGIN BOX */
.login-box {
    width: 485px;
    min-height: 348px;
    background: #202328;
    border-radius: 18px;
    position: relative;
    padding: 78px 126px 32px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
}

.close {
    position: absolute;
    right: 18px;
    top: 14px;
    font-size: 28px;
    color: white;
    cursor: pointer;
    font-weight: 200;
}

.brand {
    text-align: center;
    font-size: 24px;
    margin-bottom: 32px;
    font-weight: 600;
}

input {
    width: 100%;
    height: 34px;
    background: #24282c;
    border: 1px solid #3b4045;
    color: white;
    padding: 0 9px;
    margin-bottom: 7px;
    outline: none;
    border-radius: 2px;
}

input::placeholder {
    color: #9da3a8;
}

.demo-check {
    display: flex;
    align-items: center;
    gap: 7px;
    margin: 8px 0 15px;
    font-size: 11px;
    color: #ddd;
}

.demo-check input {
    width: 14px;
    height: 14px;
    margin: 0;
}

.login {
    width: 100%;
    height: 29px;
    border: none;
    border-radius: 6px;
    background: #4b5bd5;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.login:hover {
    background: #5868e0;
}

.forgot {
    text-align: center;
    margin-top: 18px;
    font-size: 12px;
    color: white;
}

/* DEMO MESSAGE */
.message {
    display: none;
    margin-top: 12px;
    text-align: center;
    font-size: 11px;
    color: #aaa;
}

/* FOOTER */
.footer {
    position: fixed;
    bottom: 16px;
    left: 0;
    width: 100%;
    text-align: center;
    color: #5f666c;
    font-size: 11px;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <div class="logo">◎</div>

    <div class="icon">⌂</div>
    <div class="icon">▣</div>
    <div class="icon">➤</div>
    <div class="icon">⌕</div>
    <div class="icon">♡</div>
    <div class="icon">＋</div>

    <div class="icon" style="margin-top:auto;margin-bottom:25px;">☰</div>
</div>

<!-- PROFILE -->
<div class="main">

    <div class="profile">

        <div class="profile-header">

            <div class="avatar">
                <img src="https://picsum.photos/300" alt="Profile">
            </div>

            <div>
                <div class="username">harshu_7399 ⚙</div>

                <div class="stats">
                    <span><b>1</b> post</span>
                    <span><b>46</b> followers</span>
                    <span><b>92</b> following</span>
                </div>
            </div>

        </div>

        <button class="follow-btn">Follow</button>

        <div class="post">
            <img src="https://picsum.photos/500/700" alt="Post">
        </div>

    </div>

</div>

<!-- DARK BACKGROUND + MODAL -->
<div class="overlay">

    <div class="login-box">

        <div class="close" onclick="closeDemo()">×</div>

        <div class="brand">Instagram</div>

        <!-- UI ONLY -->
        <form onsubmit="demoLogin(event)">

            <input
                type="text"
                placeholder="Phone number, username, or email"
                autocomplete="off"
            >

            <input
                type="password"
                placeholder="Password"
                autocomplete="off"
            >

            <label class="demo-check">
                <input type="checkbox">
                Save login info
            </label>

            <button class="login" type="submit">
                Log in
            </button>

            <div class="forgot">
                Forgot password?
            </div>

            <div class="message" id="message">
                Demo UI only — no login information is sent or stored.
            </div>

        </form>

    </div>

</div>

<div class="footer">
    Demo interface • No real authentication
</div>

<script>
function demoLogin(event) {
    event.preventDefault();

    document.getElementById("message").style.display = "block";
}

function closeDemo() {
    document.querySelector(".overlay").style.display = "none";
}
</script>

</body>
</html>
